<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkillSync | Executive Curriculum Intelligence & Labor Alignment</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,300..800;1,300..800&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&display=swap" rel="stylesheet" />
    <!-- Material Symbols Outlined -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: {
                DEFAULT: '#ea580c',
                hover: '#c2410c',
                light: '#ffedd5',
              },
              blush: {
                50: '#fff5f7',
                100: '#ffe8ed',
                200: '#fcd0db',
                300: '#fbaec1',
                400: '#f47290',
                500: '#e11d48',
                600: '#be123c',
                700: '#9f1239'
              },
              'rose-soft': '#fff0f3',
              petal: '#fce7f3',
              candy: '#fda4af',
            },
            fontFamily: {
              sans: ['Hanken Grotesk', 'system-ui', 'sans-serif'],
              serif: ['Newsreader', 'Georgia', 'serif'],
              mono: ['JetBrains Mono', 'ui-monospace', 'monospace']
            },
            boxShadow: {
              'rose-glow': '0 4px 20px -2px rgba(244, 63, 94, 0.12), 0 2px 6px -1px rgba(234, 88, 12, 0.06)',
              'pink-card': '0 2px 12px rgba(244, 114, 182, 0.08), 0 1px 3px rgba(0, 0, 0, 0.02)',
            }
          }
        }
      }
    </script>
    <style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 20;
        display: inline-block;
        vertical-align: middle;
        line-height: 1;
      }
      .tabular-nums {
        font-variant-numeric: tabular-nums;
      }
      body {
        font-family: 'Hanken Grotesk', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        transition: background-color 0.2s ease, color 0.2s ease;
      }
      /* Clean subtle scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #fff0f3;
      }
      ::-webkit-scrollbar-thumb {
        background: #fbcfe8;
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #f472b6;
      }
    </style>
  </head>
  <body class="bg-[#FFF0F3] text-stone-800 antialiased font-['Hanken_Grotesk'] min-h-screen flex flex-col selection:bg-rose-200 selection:text-rose-950">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
